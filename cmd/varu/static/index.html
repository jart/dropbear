<!DOCTYPE html>
<meta charset="utf-8">
<title>varu dashboard</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="//worker.jart.workers.dev/fonts/fontsvf.css">
<body>

<header>
  <h1 id="symbol">--</h1>
  <span id="price">--</span>
  <span id="time">--</span>
  <button id="pauseBtn" onclick="pause()">Pause</button>
  <button id="resumeBtn" onclick="resume()" disabled>Resume</button>
  <span id="status"></span>
</header>

<div class="grid">
  <section class="chart-section">
    <h2>risk profile</h2>
    <canvas id="riskChart" width="800" height="300"></canvas>
  </section>

  <section class="stats-section">
    <h2>statistics</h2>
    <table id="statsTable">
      <tr><td>payoff</td><td id="statPayoff">--</td></tr>
      <tr><td>liquidation</td><td id="statLiq">--</td></tr>
      <tr><td>fees</td><td id="statFees">--</td></tr>
      <tr><td>realized</td><td id="statRealized">--</td></tr>
      <tr><td>worst</td><td id="statWorst">--</td></tr>
      <tr><td>cash</td><td id="statCash">--</td></tr>
      <tr><td>notional</td><td id="statNotional">--</td></tr>
      <tr><td>eod</td><td id="statEOD">--</td></tr>
      <tr><td>sigma</td><td id="statSigma">--</td></tr>
      <tr><td>bias</td><td id="statBias">--</td></tr>
      <tr><td>delta</td><td id="statDelta">--</td></tr>
      <tr><td>gamma</td><td id="statGamma">--</td></tr>
      <tr><td>theta</td><td id="statTheta">--</td></tr>
      <tr><td>vega</td><td id="statVega">--</td></tr>
      <tr><td>error</td><td id="statError">--</td></tr>
      <tr><td>volume</td><td id="statVolume">--</td></tr>
    </table>
  </section>

  <section class="positions-section">
    <h2>positions</h2>
    <table id="positionsTable">
      <thead>
        <tr>
          <th>qty</th><th>bid</th><th>ask</th><th>mid</th><th>delta</th><th>prob</th>
          <th class="strike-col"></th>
          <th>qty</th><th>bid</th><th>ask</th><th>mid</th><th>delta</th><th>prob</th>
        </tr>
      </thead>
      <tbody id="positionsBody"></tbody>
    </table>
  </section>

  <section class="strategies-section">
    <h2>strategies</h2>
    <div id="strategiesList"></div>
  </section>

  <section class="flags-section">
    <h2>flags</h2>
    <form id="flagsForm" onsubmit="return submitFlags(event)">
      <label>sigmas <input name="sigmas" type="text" size="6"></label>
      <label>budget <input name="budget" type="text" size="8"></label>
      <label>floor <input name="floor" type="text" size="8"></label>
      <label>spread <input name="spread" type="text" size="6"></label>
      <label>cooldown <input name="cooldown" type="text" size="6"></label>
      <label>patience <input name="patience" type="text" size="6"></label>
      <label>prune <input name="prune" type="text" size="6"></label>
      <label>w-payoff <input name="wPayoff" type="text" size="6"></label>
      <label>w-risk <input name="wRisk" type="text" size="6"></label>
      <label>w-delta <input name="wDelta" type="text" size="6"></label>
      <button type="submit">Apply</button>
    </form>
  </section>
</div>

<script src="/static/app.js"></script>
