<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>varulab</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>varulab</h1>
  <nav>
    <button class="tab active" data-tab="grid">Grid</button>
    <button class="tab" data-tab="summary">Summary</button>
    <button class="tab" data-tab="flags">Flags</button>
    <button class="tab" data-tab="status">Status</button>
  </nav>
  <div id="counts"></div>
</header>
<main>
  <section id="grid" class="panel active"></section>
  <section id="summary" class="panel"></section>
  <section id="flags" class="panel"></section>
  <section id="status" class="panel"></section>
</main>
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <button class="modal-close">&times;</button>
    <pre id="modal-log"></pre>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
