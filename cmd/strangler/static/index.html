<!DOCTYPE html>
<meta charset="utf-8">
<title>strangler dashboard</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="//worker.jart.workers.dev/fonts/fontsvf.css">
<body>

<header>
  <h1 id="symbol">--</h1>
  <span id="price">--</span>
  <span id="time">--</span>
  <span class="state-label" id="state">--</span>
  <button id="pauseBtn" onclick="pause()">Pause</button>
  <button id="resumeBtn" onclick="resume()" disabled>Resume</button>
  <span id="status"></span>
</header>

<div class="grid">
  <section class="chart-section">
    <h2>risk profile</h2>
    <canvas id="riskChart" width="800" height="400"></canvas>
  </section>

  <section class="stats-section">
    <h2>statistics</h2>
    <table id="statsTable">
      <tr><td>liquidation</td><td id="statLiq">--</td></tr>
      <tr><td>worst</td><td id="statWorst">--</td></tr>
      <tr><td>realized</td><td id="statRealized">--</td></tr>
      <tr><td>cash</td><td id="statCash">--</td></tr>
      <tr><td>fees</td><td id="statFees">--</td></tr>
      <tr><td>shares</td><td id="statShares">--</td></tr>
      <tr><td>share cost</td><td id="statShareCost">--</td></tr>
      <tr><td>orders</td><td id="statOrders">--</td></tr>
      <tr><td>delta</td><td id="statDelta">--</td></tr>
      <tr><td>gamma</td><td id="statGamma">--</td></tr>
      <tr><td>theta</td><td id="statTheta">--</td></tr>
      <tr><td>vega</td><td id="statVega">--</td></tr>
      <tr><td>error</td><td id="statError">--</td></tr>
      <tr><td>volume</td><td id="statVolume">--</td></tr>
    </table>
  </section>

  <section class="positions-section">
    <h2>positions</h2>
    <table id="positionsTable">
      <thead>
        <tr>
          <th>qty</th><th>bid</th><th>ask</th><th>mid</th><th>delta</th>
          <th class="strike-col"></th>
          <th>qty</th><th>bid</th><th>ask</th><th>mid</th><th>delta</th>
        </tr>
      </thead>
      <tbody id="positionsBody"></tbody>
    </table>
  </section>

  <section class="flags-section">
    <h2>flags</h2>
    <form id="flagsForm" onsubmit="return submitFlags(event)">
      <label>tolerance <input name="tolerance" type="text" size="6"></label>
      <label>quantum <input name="quantum" type="text" size="6"></label>
      <label>spread <input name="spread" type="text" size="6"></label>
      <label>patience <input name="patience" type="text" size="6"></label>
      <button type="submit">Apply</button>
    </form>
  </section>
</div>

<script src="/static/app.js"></script>
