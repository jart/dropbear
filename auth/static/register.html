<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Dropbear</title>
    <link rel="stylesheet" href="/auth/static/auth.css">
</head>
<body>
    <div class="container">
        <h1>Register</h1>
        <p class="info">You'll need a security key with biometric (like YubiKey Bio) to register.</p>
        <div id="error" class="error"></div>
        <form id="registerForm" onsubmit="webauthnRegister(inviteToken); return false;">
            <input type="text" id="name" placeholder="Your name" autofocus>
            <button type="submit" id="register">Register with Security Key</button>
        </form>
    </div>
    <script src="/auth/static/webauthn.js"></script>
    <script>
        const inviteToken = new URLSearchParams(window.location.search).get('token') || '';
    </script>
</body>
</html>
