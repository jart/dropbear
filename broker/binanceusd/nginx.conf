server {
    listen 80 fastopen=256;
    listen [::]:80;
    server_name nickel.justinestreet.capital;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

upstream binance_api {
    least_conn;
    server api1.binance.com:443 weight=5;
    server api2.binance.com:443 weight=5;
    server api3.binance.com:443 weight=5;
    server api4.binance.com:443 weight=5;
    server api.binance.com:443 backup;  # fallback if api1-4 are flaky
    keepalive 32;  # Keep connections to Binance warm
}

server {
    listen 443 ssl http2 fastopen=256;

    # IP restriction - only allow penny
    if ($allowed_ip = 0) {
        return 403;
    }
    listen [::]:443 ssl http2;
    server_name nickel.justinestreet.capital;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/nickel.justinestreet.capital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nickel.justinestreet.capital/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session settings for performance
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Low-latency zero-buffering settings
    tcp_nodelay on;
    proxy_buffering off;
    proxy_request_buffering off;

    # Disable output buffering
    gzip off;

    # Keep-alive settings
    keepalive_timeout 65;

    root /var/www/html;

    # e.g. https://nickel.justinestreet.capital/api/v3/depth?symbol=BTCUSDT&limit=5000
    location /api {
        proxy_pass https://binance_api;
        proxy_http_version 1.1;
        proxy_set_header Host api.binance.com;
        proxy_set_header Connection "";  # Enable keepalive to upstream
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    location /fapi/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $upstream_fut fapi.binance.com;
        proxy_pass https://$upstream_fut;
        proxy_http_version 1.1;
        proxy_set_header Host fapi.binance.com;
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    location /dapi/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $upstream_fut dapi.binance.com;
        proxy_pass https://$upstream_fut;
        proxy_http_version 1.1;
        proxy_set_header Host dapi.binance.com;
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    location /ws {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $upstream_ws stream.binance.com:9443;
        proxy_pass https://$upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host stream.binance.com;
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Public market data (no API key required)
    # e.g. https://nickel.justinestreet.capital/pub/api/v3/depth?symbol=BTCUSDT&limit=5000
    location /pub/api/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $upstream_pub data-stream.binance.vision;
        proxy_pass https://$upstream_pub/api/;
        proxy_http_version 1.1;
        proxy_set_header Host data-stream.binance.vision;
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    location /pub/ws {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $upstream_pub_ws data-stream.binance.vision;
        proxy_pass https://$upstream_pub_ws/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host data-stream.binance.vision;
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    location /fut/ws {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $upstream_pub_ws fstream.binance.com;
        proxy_pass https://$upstream_pub_ws/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host data-stream.binance.vision;
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }
}
